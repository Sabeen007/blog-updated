<!DOCTYPE html>
<html>
<head>
    <title>Upload Profile Image</title>
</head>
<body>
    <h2>Upload Profile Image</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Upload</button>
    </form>
    <a href="{% url 'profile_view' %}">View Profile</a>
</body>
</html>
