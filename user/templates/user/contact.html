{% extends 'admin/main.html' %}
{% block title %}
  Dashboard
{% endblock %}
{% block content %}
  <div class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
      <!-- Contact Table -->
      <div class="bg-white p-8 rounded-lg shadow-lg">
        <h2 class="text-xl font-bold mb-4">Contact</h2>
        <table class="min-w-full bg-white border border-gray-300">
          <thead>
            <tr class="bg-gray-200">
              <th class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">S.N.</th>
              <th class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">Full Name</th>
              <th class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">Email</th>
              <th class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">Contact</th>
              <th class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">Address</th>
              <th class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">1</td>
              <td class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">John Doe</td>
              <td class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">john@example.com</td>
              <td class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">123-456-7890</td>
              <td class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">damak</td>
              <td class="py-2 px-4 border-b text-left text-sm font-medium text-gray-700">idk</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
{% endblock %}
